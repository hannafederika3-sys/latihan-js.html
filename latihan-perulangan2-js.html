<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 2 Perulangan</title>
</head>
<body>

    <h2>Program Perulangan dengan While</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Mulai dari angka terbesar (3) dan menurun hingga 1
        let i = 3;
        while (i >= 0) {
            // jalankan selama kondisi i lebih besar atau sama dengan 0
            console.log("Angka: " + i);
            i--;
        }
        // dicetak "start!" setelah perulangan selesai
        console.log("start!");
    </script>

</body>
</html>
