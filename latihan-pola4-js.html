<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan soal 4 - pola</title>
</head>
<body>

    <h2>pola segitiga siku-siku</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        
        function buatSegitigaSamaSisi(tinggi) {
    let baris = '';
    for (let i = 1; i <= tinggi; i++) {
        let spasi = ' '.repeat(tinggi - i);
        let angka = (i + ' ').repeat(i);
        baris += spasi + angka + '\n';
    }
    console.log(baris);
}

// Mengubah tinggi menjadi 4 tingkat
buatSegitigaSamaSisi(4);
    </script>
</html>
