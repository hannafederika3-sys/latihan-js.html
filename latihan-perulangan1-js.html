<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 1 Perulangan</title>
</head>
<body>

    <h2>Program Perulangan dengan For</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Program perulangan untuk mencetak angka dari 1 sampai 5
        for (let i = 1; i <= 5; i++) {
            console.log("Angka: " + i);
        }
    </script>

</body>
</html>
