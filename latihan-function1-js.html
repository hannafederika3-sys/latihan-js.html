<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 1 Function</title>
</head>
<body>

    <h2>Program Function</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Fungsi untuk mencetak "FizzBuzz" berdasarkan angka yang diberikan
        function fizzBuzz(n) {
            for (let i = 1; i <= n; i++) {
                if (i % 15 === 0) {
                    console.log("FizzBuzz");
                } else if (i % 3 === 0) {
                    console.log("Fizz");
                } else if (i % 5 === 0) {
                    console.log("Buzz");
                } else {
                    console.log(i);
                }
            }
        }

// Uji coba
fizzBuzz(15); // Output: FizzBuzz
fizzBuzz(9);  // Output: Fizz
fizzBuzz(10); // Output: Buzz

    </script>
</body>
</html>
