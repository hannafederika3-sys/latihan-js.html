<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 2 Function</title>
</head>
<body>

    <h2>Program Function</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Fungsi untuk mengecek genap atau ganjil function cekGenapGanjil(angka)
        function cekGenapGanjil(angka) {  
            if (angka % 2 === 0) {
                return angka + " adalah Genap";
            } else {
                return angka + " adalah Ganjil";
            }
        }
// Uji coba
console.log(cekGenapGanjil(4)); // Output: 4 adalah Genap
console.log(cekGenapGanjil(7)); // Output: 7 adalah Ganjil
    </script>
</body>
</html>
